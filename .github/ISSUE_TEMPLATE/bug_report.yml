name: Bug report
description: Report incorrect behaviour in one of the Burning Cost libraries.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Which library are you reporting against?
      options:
        - bayesian-pricing
        - insurance-causal
        - insurance-causal-policy
        - insurance-conformal
        - insurance-conformal-ts
        - insurance-covariate-shift
        - insurance-datasets
        - insurance-deploy
        - insurance-dispersion
        - insurance-distributional
        - insurance-distributional-glm
        - insurance-distill
        - insurance-dynamics
        - insurance-fairness
        - insurance-frequency-severity
        - insurance-gam
        - insurance-glm-tools
        - insurance-governance
        - insurance-interactions
        - insurance-monitoring
        - insurance-multilevel
        - insurance-optimise
        - insurance-quantile
        - insurance-recurrence
        - insurance-severity
        - insurance-spatial
        - insurance-survival
        - insurance-synthetic
        - insurance-telematics
        - insurance-thin-data
        - insurance-trend
        - insurance-whittaker
        - shap-relativities
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version
      description: Run `uv pip show <library-name>` or check `importlib.metadata.version('<package>')`.
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "e.g. 3.12.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the incorrect behaviour? Be specific about which function, class, or method is involved.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A numbered sequence of steps that reliably triggers the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead? Include the full traceback if there is one.
    validations:
      required: true

  - type: textarea
    id: mre
    attributes:
      label: Minimal reproducible example
      description: >
        A self-contained code snippet that demonstrates the issue.
        Use synthetic data — do not paste real policy or claims data.
      render: python
    validations:
      required: false
